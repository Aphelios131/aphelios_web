{{define "base"}}
<!DOCTYPE html class="h-full">
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="/static/src/output.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
        <title>{{template "title" .}}</title>
    </head>

    <body class="bg-emerald-950 h-full flex flex-col">
            {{template "nav" .}}
        <main class="flex-grow">
            <!-- {{with .Flash}}
                <div class="text-2xl font-bold my-4 text-center text-red-900">{{.}}</div>
            {{end}} -->

            {{with .Flash}}
            <div id="flash-toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-100 border-2 border-red-700 text-red-900 px-6 py-3 rounded-lg shadow-lg text-lg font-bold">
            {{.}}
            </div>
            <script>
            // 3秒后自动消失
            setTimeout(() => {
            const toast = document.getElementById('flash-toast');
            if (toast) toast.remove();
            }, 3000);
            </script>
            {{end}}
            {{template "main" .}}
        </main>

        <script>
        // DOM加载完成后自动高亮页面里所有 <pre><code>
        document.addEventListener('DOMContentLoaded', function() {
        hljs.highlightAll();
        });
        </script>

        <footer class="text-white text-center">
            <h1>power by aphelios</h1>
            <small><a href="https://github.com/Aphelios131/aphelios_web.git">
            GitHub</a></small>
        </footer>
    </body>
</html>
{{end}}
