{{define "title"}}
Signup
{{end}}

{{define "main"}}
<div class="py-12 flex justify-center">
    <div class="my-9 px-8 px-8 text-white bg-emerald-800 rounded shadow-sm">
        <form action="/admin/signup" method="post">
            <!-- Include the CSRF token -->
            <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
            <div class="pt4 pb-8 py-4 font-bold text-3xl text-center">Welconme to This web site</div>
            <div class="py-2">
                <label  class="text-sm font-semibold">Email</label>
                <input type="email" name="email" placeholder="example@email.com" required 
                class="w-full px-2 py-2 text-black" >
            </div>
            <div class="py-2">
                <label class="text-sm font-semibold">password:</label>
                <input type="password" name="password" placeholder="******" required 
                class="w-full px-2 py-2 text-black" >
            </div>
            <div class="py-4">
                <button class="w-full py-4 px-2 bg-lime-500 hover:bg-lime-300 transition-color">Signup</button>
            </div>
            <div class="py-2">
                <p class="text-xs text-gray-500">
                    Already have an acount? <a href="/admin/login" class="underline">Login</a>
                </p>
            </div>
        </form>
    </div>
</div>
{{end}}
